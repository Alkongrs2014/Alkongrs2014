# Alkongrs — الموقع (/stocks/) والبيانات المنشورة (/data/) من روابط الإصدارات الذرّية.
# المنفذ 80 وحده ومفتوحٌ لـCloudFront فقط (مجموعة الأمان)؛ CloudFront يقدّم HTTPS للزوّار.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/alkongrs/www;
    server_tokens off;
    disable_symlinks off;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;
    gzip_min_length 1024;

    location = / { return 302 /stocks/; }
    location = /stocks { return 301 /stocks/; }

    location /stocks/ {
        index index.html;
        # عامل الخدمة والهيكل يُعاد التحقّق منهما دائماً (النسخة V تحكم الذاكرة)
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    location /data/ {
        # البيانات تتغيّر كل دقيقتين — بلا ذاكرة وسيطة أبداً
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        # الحالة الداخلية لا تُنشر أصلاً (NO_PUBLISH)، وهذا حزامٌ ثانٍ
        location ~ /\.|state\.json$ { return 404; }
        try_files $uri =404;
    }

    location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }
    location / { return 404; }
}
