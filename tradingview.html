<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تريدنق فيو — الشارت المباشر</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #131722; color: #d1d4dc; font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif; }
    header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px; background: #1e222d; border-bottom: 1px solid #2a2e39; }
    header h1 { font-size: 16px; font-weight: 600; }
    header a { color: #2962ff; text-decoration: none; font-size: 13px; }
    header a:hover { text-decoration: underline; }
    #ticker { background: #1e222d; }
    #chart { height: calc(100% - 96px); }
    .tradingview-widget-container { height: 100%; }
  </style>
</head>
<body>
  <header>
    <h1>📈 تريدنق فيو — الشارت المباشر</h1>
    <a href="https://www.tradingview.com/chart/" target="_blank" rel="noopener">فتح الموقع الكامل ↗</a>
  </header>

  <!-- شريط الأسعار -->
  <div id="ticker">
    <div class="tradingview-widget-container">
      <div class="tradingview-widget-container__widget"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-ticker-tape.js" async>
      {
        "symbols": [
          {"proName": "BINANCE:BTCUSDT", "title": "بيتكوين"},
          {"proName": "BINANCE:ETHUSDT", "title": "إيثيريوم"},
          {"proName": "OANDA:XAUUSD", "title": "الذهب"},
          {"proName": "FX:EURUSD", "title": "يورو/دولار"},
          {"proName": "NASDAQ:AAPL", "title": "آبل"},
          {"proName": "TVC:USOIL", "title": "النفط"}
        ],
        "showSymbolLogo": true,
        "colorTheme": "dark",
        "isTransparent": false,
        "displayMode": "adaptive",
        "locale": "ar_AE"
      }
      </script>
    </div>
  </div>

  <!-- الشارت المتقدم -->
  <div id="chart">
    <div class="tradingview-widget-container" style="height:100%;width:100%">
      <div id="tradingview_chart" style="height:100%;width:100%"></div>
      <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
      <script type="text/javascript">
        new TradingView.widget({
          "container_id": "tradingview_chart",
          "autosize": true,
          "symbol": "BINANCE:BTCUSDT",
          "interval": "60",
          "timezone": "Asia/Riyadh",
          "theme": "dark",
          "style": "1",
          "locale": "ar_AE",
          "withdateranges": true,
          "hide_side_toolbar": false,
          "allow_symbol_change": true,
          "details": true,
          "studies": ["RSI@tv-basicstudies"]
        });
      </script>
    </div>
  </div>
</body>
</html>
