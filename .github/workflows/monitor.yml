name: مراقبة المنشور (قراءةٌ وحدها)

# كانت هنا مهمّتان (market-data · daily-data) تجلبان من السحابة وتدفعان
# فرع data بـ`push -f` — كاتبٌ ثانٍ ببياناتٍ منقوصة (ياهو يحظر السحابة،
# وTwelve Data يكفي 14 رمزاً)، يستطيع أن يكتب فوق بيانات الجهاز المحلي.
# صارت **قراءةً وتحقّقاً فقط** (INV-15): الكاتب الرسمي الوحيد هو المجدول
# المحلي. وفشلُ هذه المهمّة يصل المالكَ بريداً من GitHub.
#
# المراقبة هنا ‎24/7‎؛ **توليد البيانات** يبقى على الجهاز — قيدُ بنيةٍ تحتية.

on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - name: الطبيب على الالتزام المنشور (مخطّطات · فريمات · دفتران · مرجع · حتمية)
        run: node scripts/doctor.mjs --remote
      - name: الصحّة — طزاجة المنشور وآخر نسخة سليمة
        run: node scripts/health.mjs --ci
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: monitor-report, path: reports/, retention-days: 7 }
